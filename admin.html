<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة واصل شات</title><link rel="stylesheet" href="/styles.css"><style>body{padding:22px}.wrap{max-width:1000px;margin:auto}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.metric,.report{background:white;border:1px solid var(--line);border-radius:13px;padding:15px;margin:9px 0}.metric b{display:block;font-size:24px;color:var(--purple)}.metric small,.report p{font-size:10px;color:var(--muted)}.login{max-width:400px;background:white;padding:22px;border-radius:16px;margin:35px auto}.login input{display:block;width:100%;padding:11px;margin:10px 0;border:1px solid var(--line);border-radius:9px}.report button{border:0;background:#e4f6ed;color:#287e5a;border-radius:8px;padding:7px 12px}@media(max-width:550px){.metrics{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>لوحة إدارة واصل شات</h1><a href="/">العودة للتطبيق</a><form id="login" class="login"><h2>دخول المشرف</h2><input name="username" placeholder="اسم المشرف" required><input name="password" type="password" placeholder="كلمة المرور" required><button class="primary">دخول</button><p id="err" class="error"></p></form><section id="panel" class="hide"><div class="metrics"><div class="metric"><b id="users">0</b><small>المستخدمون</small></div><div class="metric"><b id="messages">0</b><small>الرسائل العادية</small></div><div class="metric"><b id="anonymous">0</b><small>المجهولة</small></div><div class="metric"><b id="reports">0</b><small>بلاغات مفتوحة</small></div></div><h2>البلاغات</h2><div id="reportList"></div><h2>المستخدمون</h2><div id="userList"></div></section></div><script>
async function api(u,o={}){let r=await fetch(u,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...o}),d=await r.json();if(!r.ok)throw Error(d.error||"خطأ");return d}
async function load(){let [a,b,c]=await Promise.all([api("/api/admin/overview"),api("/api/admin/reports"),api("/api/admin/users")]);Object.keys(a).forEach(k=>document.getElementById(k).textContent=a[k]);document.getElementById("reportList").innerHTML=b.reports.map(x=>`<article class="report"><b>#${x.id} · ${x.reason}</b><p>المبلّغ @${x.reporter} · المستهدف @${x.target||"غير محدد"} · ${x.details||""}</p><button data-close="${x.id}">إغلاق البلاغ</button></article>`).join("")||"<p>لا توجد بلاغات.</p>";document.querySelectorAll("[data-close]").forEach(b=>b.onclick=async()=>{await api("/api/admin/reports/"+b.dataset.close+"/close",{method:"POST"});load()});document.getElementById("userList").innerHTML=c.users.map(u=>`<div class="report">@${u.username} — ${u.display_name} (${u.role})</div>`).join("")}
document.getElementById("login").onsubmit=async e=>{e.preventDefault();try{await api("/api/login",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await load();e.target.classList.add("hide");document.getElementById("panel").classList.remove("hide")}catch(x){document.getElementById("err").textContent=x.message}};(async()=>{try{await load();document.getElementById("login").classList.add("hide");document.getElementById("panel").classList.remove("hide")}catch{}})();
</script></body></html>
